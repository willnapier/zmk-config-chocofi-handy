name: Build Chocofi Handy firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      - name: Build Chocofi right (Handy remote)
        run: >
          west build --pristine -s zmk/app -b nice_nano_v2 --
          -DSHIELD="chocofi_right"
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename Handy firmware
        run: cp build/zephyr/zmk.uf2 chocofi_right_handy.uf2

      # Capture the COMPILED devicetree for the Handy build, BEFORE the
      # settings_reset build below wipes build/ with --pristine. Added
      # 2026-08-31 for design-forum thread term-chocofi-page-pos16-left: the
      # .keymap SOURCE is not the firmware, and the open question is whether
      # the PAGE cell at position 16 actually compiles to LEFT's usage.
      - name: Capture compiled devicetree (Handy)
        run: |
          cp build/zephyr/zephyr.dts chocofi_zephyr.dts
          cp build/zephyr/include/generated/zephyr/devicetree_generated.h \
             chocofi_devicetree_generated.h || \
          cp build/zephyr/include/generated/devicetree_generated.h \
             chocofi_devicetree_generated.h

      - name: Build settings_reset
        run: >
          west build --pristine -s zmk/app -b nice_nano_v2 --
          -DSHIELD="settings_reset"
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename settings_reset firmware
        run: cp build/zephyr/zmk.uf2 settings_reset.uf2

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            chocofi_right_handy.uf2
            settings_reset.uf2
            chocofi_zephyr.dts
            chocofi_devicetree_generated.h
