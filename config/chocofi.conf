# Chocofi right half as standalone BLE remote
# (no left half, no split peripheral role)

CONFIG_ZMK_SPLIT=n

CONFIG_ZMK_KEYBOARD_NAME="Chocofi-Handy"

# Three hosts: iPhone, nimbini, Mac
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=y
# 15 minutes — remote spends most time idle
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_DISPLAY=n

# Position 9 (') is now in five combos: esc_right, bootloader, and the three
# host-select chords added 2026-08-31. Headroom of one.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
